server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: skinproof-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/skinproof}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

youcam:
  api-key: ${YOUCAM_API_KEY:}
  poll-interval: ${YOUCAM_POLL_INTERVAL:PT3S}
  timeout: ${YOUCAM_TASK_TIMEOUT:PT2M}

skinproof:
  auth:
    issuer-uri: ${SKINPROOF_AUTH_ISSUER_URI:}
    client-id: ${SKINPROOF_AUTH_CLIENT_ID:}
  storage:
    image-bucket: ${SKINPROOF_IMAGE_BUCKET:}
  analysis:
    daily-cap-per-experiment: ${ANALYSIS_DAILY_CAP_PER_EXPERIMENT:3}
    max-attempts: ${ANALYSIS_MAX_ATTEMPTS:3}
    retry-base: ${ANALYSIS_RETRY_BASE:PT10S}
    poller-interval: ${ANALYSIS_POLLER_INTERVAL:PT2S}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server.error:
  include-message: never

logging:
  level:
    root: INFO