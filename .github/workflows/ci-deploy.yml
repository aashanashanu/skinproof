name: SkinProof CI and AWS Demo Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test API
        run: gradle -p backend test

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: hashicorp/setup-terraform@v3

      - name: Format and validate AWS infrastructure
        run: |
          terraform fmt -recursive infra
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  deploy:
    environment: main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      API_INSTANCE_ID: ${{ vars.API_INSTANCE_ID }}
      COGNITO_HOSTED_UI_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      COGNITO_ISSUER_URL: ${{ vars.COGNITO_ISSUER_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment settings
        run: |
          for name in AWS_REGION AWS_ROLE_ARN FRONTEND_BUCKET CLOUDFRONT_DISTRIBUTION_ID ECR_REPOSITORY_URI API_INSTANCE_ID COGNITO_HOSTED_UI_DOMAIN COGNITO_CLIENT_ID COGNITO_ISSUER_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name" >&2
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URI }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY_URI }}:latest

      - name: Build and publish frontend
        working-directory: frontend
        run: |
          npm ci
          export VITE_COGNITO_HOSTED_UI_DOMAIN="$COGNITO_HOSTED_UI_DOMAIN"
          export VITE_COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID"
          export VITE_COGNITO_ISSUER_URL="$COGNITO_ISSUER_URL"
          npm run build
          aws s3 sync dist "s3://${FRONTEND_BUCKET}" --delete --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://${FRONTEND_BUCKET}/index.html" --cache-control 'no-cache,max-age=0'

      - name: Refresh CloudFront content
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths '/*'

      - name: Deploy API with Systems Manager
        run: |
          auth_env_args=$(printf '  --env SKINPROOF_AUTH_ISSUER_URI=%s --env SKINPROOF_AUTH_CLIENT_ID=%s \\\n' "$COGNITO_ISSUER_URL" "$COGNITO_CLIENT_ID" | base64 | tr -d '\n')
          patch_command="sudo python3 -c 'import base64,pathlib; p=pathlib.Path(\"/opt/skinproof/deploy.sh\"); lines=p.read_text().splitlines(keepends=True); lines=[line for line in lines if not line.lstrip().startswith((\"--env SKINPROOF_AUTH_ISSUER_URI=\", \"--env SKINPROOF_AUTH_CLIENT_ID=\"))]; marker=\"--env \\\"YOUCAM_API_KEY=\"; index=next(i for i,line in enumerate(lines) if marker in line); lines[index+1:index+1]=[base64.b64decode(\"${auth_env_args}\").decode()]; p.write_text(\"\".join(lines))'"
          deploy_command="$patch_command && sudo sed -i '/awslogs-create-stream/d' /opt/skinproof/deploy.sh && sudo /opt/skinproof/deploy.sh '${ECR_REPOSITORY_URI}:${GITHUB_SHA}'"
          params_file="$(mktemp)"
          jq -n --arg cmd "$deploy_command" '{commands: [$cmd]}' > "$params_file"
          command_id=$(aws ssm send-command \
            --instance-ids "$API_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$params_file" \
            --comment "SkinProof deployment ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)
          if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "$API_INSTANCE_ID"; then
            echo "SSM deployment command failed; invocation details:" >&2
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$API_INSTANCE_ID" \
              --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
              --output json >&2 || true
            exit 1
          fi